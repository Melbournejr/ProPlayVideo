name: Android Release CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/ota-signing.jks
        shell: bash

      - name: Xác định tên Repo, VersionName và VersionCode
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          VER_CODE=$((100 + ${GITHUB_RUN_NUMBER}))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VER_NAME="1.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VER_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${REPO_NAME}-v${VER_NAME}.apk" >> $GITHUB_OUTPUT
        shell: bash

      - name: Tải Gradle 8.4 và Build APK Release (R8 Minify + Resource Shrinking)
        env:
          SIGNING_STORE_FILE: ota-signing.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ ! -f /tmp/gradle-8.4/bin/gradle ]; then
            curl -L --retry 5 --retry-delay 3 -sS https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle.zip
            unzip -q -o /tmp/gradle.zip -d /tmp
          fi
          /tmp/gradle-8.4/bin/gradle assembleRelease \
            -PrepoName="${{ steps.meta.outputs.repo_name }}" \
            -PversionName="${{ steps.meta.outputs.version_name }}" \
            -PversionCode="${{ steps.meta.outputs.version_code }}" \
            --no-daemon
        shell: bash

      - name: Tạo file .sha256 và version.json cho OTA Security
        id: package_ota
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          OUT_DIR="app/build/outputs/apk/release"
          APK_NAME="${{ steps.meta.outputs.apk_name }}"
          TARGET_APK="${OUT_DIR}/${APK_NAME}"
          SHA_FILE="${TARGET_APK}.sha256"
          JSON_FILE="${OUT_DIR}/version.json"

          cp "$RAW_APK" "$TARGET_APK"
          SHA256_HEX=$(sha256sum "$TARGET_APK" | awk '{print $1}')
          echo "${SHA256_HEX}  ${APK_NAME}" > "$SHA_FILE"

          cat <<EOF > "$JSON_FILE"
          {
            "versionCode": ${{ steps.meta.outputs.version_code }},
            "versionName": "${{ steps.meta.outputs.version_name }}",
            "sha256": "${SHA256_HEX}",
            "apkName": "${APK_NAME}"
          }
          EOF

          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "sha_path=$SHA_FILE" >> $GITHUB_OUTPUT
          echo "json_path=$JSON_FILE" >> $GITHUB_OUTPUT
          echo "sha256_hex=$SHA256_HEX" >> $GITHUB_OUTPUT
        shell: bash

      - name: Tạo GitHub Release kèm APK + .sha256 + version.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "${{ steps.meta.outputs.repo_name }} ${{ steps.meta.outputs.tag_name }}"
          body: |
            Bản phát hành Release **${{ steps.meta.outputs.apk_name }}** (R8 Minified & Shrunk).
            VersionCode: ${{ steps.meta.outputs.version_code }}
            SHA-256: ${{ steps.package_ota.outputs.sha256_hex }}
          files: |
            ${{ steps.package_ota.outputs.apk_path }}
            ${{ steps.package_ota.outputs.sha_path }}
            ${{ steps.package_ota.outputs.json_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}