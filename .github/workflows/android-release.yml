name: Android Release CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tạo Gradle Wrapper và Build APK
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        shell: bash

      - name: Lấy đường dẫn APK
        id: apk_path
        run: echo "apk_path=$(find app/build/outputs/apk -name '*.apk' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Tạo GitHub Release và tải APK lên cho OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ (github.event_name == 'push' && github.ref_type == 'tag') && github.ref_name || format('Release v1.0.{0}', github.run_number) }}
          body: "Bản build tự động từ GitHub Actions. Hỗ trợ cập nhật OTA trực tiếp trong ứng dụng."
          files: ${{ steps.apk_path.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}