name: Android Release CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tạo và lưu Keystore cố định cho OTA (nếu chưa có)
        run: |
          if [ ! -f app/ota-signing.jks ]; then
            keytool -genkeypair -v \
              -keystore app/ota-signing.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias otakey \
              -storepass androidpassword \
              -keypass androidpassword \
              -dname "CN=ProPlayVideo, OU=Dev, O=ProPlay, L=Hanoi, S=HN, C=VN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/ota-signing.jks
            git commit -m "chore: persist fixed OTA signing keystore [skip ci]"
            git push origin HEAD:main || true
          fi
        shell: bash

      - name: Xác định tên Repo và Phiên bản
        id: meta
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VER_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=v${VER_NAME}" >> $GITHUB_OUTPUT
          echo "apk_name=${REPO_NAME}-v${VER_NAME}.apk" >> $GITHUB_OUTPUT
        shell: bash

      - name: Tạo Gradle Wrapper và Build APK
        run: |
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -PrepoName="${{ steps.meta.outputs.repo_name }}" -PversionName="${{ steps.meta.outputs.version_name }}" -PversionCode="${{ github.run_number }}" --no-daemon
        shell: bash

      - name: Đổi tên file APK theo chuẩn Repo + Phiên bản
        id: rename_apk
        run: |
          RAW_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          TARGET_APK="app/build/outputs/apk/debug/${{ steps.meta.outputs.apk_name }}"
          cp "$RAW_APK" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
        shell: bash

      - name: Tạo GitHub Release và tải APK lên cho OTA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "${{ steps.meta.outputs.repo_name }} ${{ steps.meta.outputs.tag_name }}"
          body: "Bản phát hành tự động **${{ steps.meta.outputs.apk_name }}**. Đã đồng bộ chữ ký số cố định cho phép cài đè OTA trực tiếp."
          files: ${{ steps.rename_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}